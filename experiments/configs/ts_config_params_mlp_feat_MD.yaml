global:
  seed: 42
  train_batch_size: 32
  eval_batch_size: 64
  print_train_loss_every: 1000
  max_epochs: 200
  validate_every: null
  patience: 10
  criterion: "loss"
  gradient_accumulation_steps: 1
  grad_clip: 1.0
  weight_decay: 1e-4
  loss_fn: "bce"
  calibrate_threshold: 0
  window_forecast: 10080
  window_pred: 1440

mlp:
  grid_search:
    variant: ["MD"]
    hid_dims: [[64], [128], [128, 64], [256, 128]]
    dropout: [0.2, 0.3]
    lr: [1e-4, 5e-4]
    agg: ["mean"]
    impute: ["fill"]
    pos_class_weight: [0, 1]