name: chemotreevsdl
channels:
  - conda-forge
dependencies:
  - python=3.10.22
  - numpy=1.26.4
  - pandas=2.3.3
  - scipy=1.15.2
  - scikit-learn=1.0.2
  - libcxx<21
  - imbalanced-learn=0.12.4
  - xgboost=3.2.0
  - catboost=1.2.10
  - joblib=1.6.0
  - pyyaml=6.0.3
  - tqdm=4.70.0
  - psutil=7.2.2
  - pytz=2026.3.post1
  - matplotlib=3.10.9
  - ipykernel=7.3.0
  - ipywidgets=8.1.9
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu117
      - torch==2.0.0+cu117; sys_platform == "linux"
      - torchvision==0.15.1+cu117; sys_platform == "linux"
      - torchaudio==2.0.1+cu117; sys_platform == "linux"
      - torch==2.13.0; sys_platform == "darwin"
      - transformers==4.35.2


